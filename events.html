<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events | KCYM Ayroor</title>
<meta name="description" content="Highlights from KCYM Ayroor's events — competitions, campaigns, pilgrimages, and celebrations.">
<link rel="icon" href="https://media.base44.com/images/public/69f1cb41579ddeee84426575/75f1d4c0e_logokcym.png">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/js/tailwind-config.js"></script>
</head>
<body class="font-body bg-background text-foreground">

<div id="site-header"></div>

<main class="pt-16">

  <!-- HERO -->
  <section class="py-20 sm:py-28 bg-gradient-to-br from-primary/5 via-background to-secondary/5">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
      <div data-reveal="up">
        <div class="w-14 h-14 rounded-2xl bg-primary/10 flex items-center justify-center mx-auto mb-6">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-calendar-days w-7 h-7 text-primary"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path><path d="M8 14h.01"></path><path d="M12 14h.01"></path><path d="M16 14h.01"></path><path d="M8 18h.01"></path><path d="M12 18h.01"></path><path d="M16 18h.01"></path></svg>
        </div>
        <h1 class="font-heading font-black text-4xl sm:text-5xl text-foreground mb-4">Events</h1>
        <p class="font-body text-muted-foreground text-lg max-w-xl mx-auto">Highlights from KCYM Ayroor's competitions, campaigns, pilgrimages, and celebrations.</p>
      </div>
    </div>
  </section>

  <!-- FILTER / SORT BAR -->
  <section class="pt-12 px-4 sm:px-6 lg:px-8 bg-muted/30">
    <div class="max-w-7xl mx-auto">
      <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
        <div class="flex flex-wrap items-center gap-2" id="type-filter-group">
          <span class="text-xs font-heading font-semibold text-muted-foreground uppercase tracking-wider mr-1">Filter:</span>
          <button type="button" data-type-filter="all" class="filter-pill active px-4 py-1.5 rounded-full border border-border text-xs font-heading font-semibold transition-colors">All</button>
          <button type="button" data-type-filter="Offline" class="filter-pill px-4 py-1.5 rounded-full border border-border text-xs font-heading font-semibold transition-colors hover:bg-muted">Offline</button>
          <button type="button" data-type-filter="Online" class="filter-pill px-4 py-1.5 rounded-full border border-border text-xs font-heading font-semibold transition-colors hover:bg-muted">Online</button>
        </div>
        <div class="flex flex-wrap items-center gap-3">
          <label class="flex items-center gap-2 text-xs font-heading font-semibold text-muted-foreground">
            Status
            <select id="status-select" class="rounded-lg border border-border bg-card px-3 py-2 text-foreground font-heading text-xs font-semibold focus:outline-none focus:ring-1 focus:ring-ring">
              <option value="all">All Events</option>
              <option value="upcoming">Upcoming</option>
              <option value="past">Past</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </label>
          <label class="flex items-center gap-2 text-xs font-heading font-semibold text-muted-foreground">
            Sort
            <select id="sort-select" class="rounded-lg border border-border bg-card px-3 py-2 text-foreground font-heading text-xs font-semibold focus:outline-none focus:ring-1 focus:ring-ring">
              <option value="date-desc">Newest First</option>
              <option value="date-asc">Oldest First</option>
              <option value="name-asc">Name (A–Z)</option>
            </select>
          </label>
        </div>
      </div>
      <p class="text-xs text-muted-foreground font-body mt-4" id="events-count"></p>
    </div>
  </section>

  <!-- EVENTS GRID -->
  <section class="py-10 px-4 sm:px-6 lg:px-8 bg-muted/30">
    <div class="max-w-7xl mx-auto">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" id="events-list"></div>
      <p id="events-empty" class="hidden text-center text-muted-foreground font-body py-16">No events match these filters.</p>
    </div>
  </section>

</main>

<div id="site-footer"></div>

<script src="assets/js/main.js"></script>
<script src="assets/js/events-data.js"></script>
<script>
  const calendarIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-calendar w-3.5 h-3.5"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg>`;
  const imagesIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-images w-4 h-4"><path d="M18 22H4a2 2 0 0 1-2-2V6"></path><path d="m22 13-1.296-1.296a2.41 2.41 0 0 0-3.408 0L11 18"></path><circle cx="12" cy="8" r="2"></circle><rect width="16" height="16" x="6" y="2" rx="2"></rect></svg>`;
  const chevron = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-down w-4 h-4 accordion-chevron shrink-0"><path d="m6 9 6 6 6-6"></path></svg>`;
  const externalIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-external-link w-3.5 h-3.5 ml-1.5"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg>`;
  const instagramIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-instagram w-3.5 h-3.5"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"></line></svg>`;

  const state = { type: "all", status: "all", sort: "date-desc" };
  const todayISO = new Date().toISOString().slice(0, 10);

  function getFilteredSortedEvents() {
    let list = EVENTS.filter((ev) => {
      if (state.type !== "all" && ev.type !== state.type) return false;
      if (state.status === "cancelled" && ev.status !== "cancelled") return false;
      if (state.status === "upcoming" && !(ev.dateValue >= todayISO && ev.status !== "cancelled")) return false;
      if (state.status === "past" && !(ev.dateValue < todayISO)) return false;
      return true;
    });

    list = list.slice().sort((a, b) => {
      if (state.sort === "date-asc") return a.dateValue.localeCompare(b.dateValue);
      if (state.sort === "name-asc") return a.title.localeCompare(b.title, "en");
      return b.dateValue.localeCompare(a.dateValue); // date-desc (default)
    });

    return list;
  }

  function eventCardHTML(ev, i) {
    const detailsId = `details-${ev.slug}`;
    const cover = ev.images && ev.images[0] ? `assets/images/events/${ev.slug}/${ev.images[0]}` : null;
    const excerpt = (ev.description || [])[0] || null;
    const restDescription = (ev.description || []).slice(1);
    const hasMore = restDescription.length || ev.resultBlock || (ev.tags && ev.tags.length) || (ev.links && ev.links.length) || (ev.images && ev.images.length) || ev.instagram;

    const badges = `
      <span class="inline-flex items-center gap-1.5 text-xs font-heading font-semibold text-muted-foreground">${calendarIcon}${ev.date}</span>
      ${ev.type ? `<span class="px-2.5 py-0.5 rounded-full bg-muted text-xs font-heading font-medium text-muted-foreground">${ev.type}</span>` : ""}
      ${ev.status === "cancelled" ? `<span class="px-2.5 py-0.5 rounded-full bg-destructive/10 text-xs font-heading font-bold text-destructive uppercase tracking-wide">Cancelled</span>` : ""}
      ${ev.instagram ? `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-muted text-xs font-heading font-medium text-muted-foreground">${instagramIcon}Instagram</span>` : ""}
    `;

    let resultBlock = "";
    if (ev.resultBlock) {
      const winners = ev.resultBlock.winners.map((w) => `<li>${w}</li>`).join("");
      const others = ev.resultBlock.others.map((o) => `<li>${o}</li>`).join("");
      resultBlock = `
        <div class="mt-4 p-4 rounded-xl bg-secondary/10 border border-secondary/30">
          <p class="font-heading font-bold text-xs uppercase tracking-wider text-foreground mb-2">🏆 ${ev.resultBlock.heading}</p>
          <ul class="font-body text-sm text-foreground/80 space-y-1 list-disc list-inside mb-3">${winners}</ul>
          <p class="font-heading font-semibold text-xs uppercase tracking-wider text-muted-foreground mb-2">${ev.resultBlock.othersHeading}</p>
          <ul class="font-body text-xs text-muted-foreground space-y-1 list-disc list-inside">${others}</ul>
        </div>`;
    }

    const tags = (ev.tags || []).map((t) => `<span class="px-2.5 py-0.5 rounded-full bg-muted text-xs font-heading font-medium text-muted-foreground">${t}</span>`).join("");
    const links = (ev.links || []).map((l) => `<a href="${l.href}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center text-sm font-heading font-semibold text-primary hover:text-primary/80 transition-colors">${l.label}${externalIcon}</a>`).join("");

    const photos = ev.images && ev.images.length ? `
      <div class="mt-4">
        <p class="inline-flex items-center gap-1.5 text-xs font-heading font-semibold text-muted-foreground uppercase tracking-wider mb-2">${imagesIcon}Photos (${ev.images.length})</p>
        <div class="grid grid-cols-3 gap-2">
          ${ev.images.map((img) => `
            <a href="assets/images/events/${ev.slug}/${img}" target="_blank" rel="noopener noreferrer" class="block aspect-square rounded-lg overflow-hidden bg-muted">
              <img src="assets/images/events/${ev.slug}/${img}" alt="${ev.title}" loading="lazy" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300">
            </a>`).join("")}
        </div>
      </div>` : "";

    // Rendered as an empty slot and hydrated with the real blockquote only after
    // the accordion has finished opening — Instagram's embed.js measures the
    // iframe's height once, right when it's created, so building it while the
    // accordion is still collapsed (max-height: 0) permanently locks it at ~2px.
    const instagramEmbed = ev.instagram ? `
      <div class="mt-4">
        <p class="inline-flex items-center gap-1.5 text-xs font-heading font-semibold text-muted-foreground uppercase tracking-wider mb-2">${instagramIcon}Instagram Post</p>
        <div class="instagram-embed-slot" data-instagram-url="${ev.instagram}" data-loaded="false"></div>
      </div>` : "";

    return `
    <article class="bg-card border border-border/50 rounded-2xl overflow-hidden hover:shadow-lg transition-all duration-300 flex flex-col" data-reveal="up" data-reveal-delay="${Math.min(i * 40, 300)}">
      ${cover ? `<div class="relative aspect-video overflow-hidden bg-muted shrink-0">
        <img src="${cover}" alt="${ev.title}" loading="lazy" class="w-full h-full object-cover">
        ${ev.status === "cancelled" ? `<div class="absolute inset-0 bg-foreground/40 flex items-center justify-center"><span class="px-4 py-1.5 rounded-full bg-destructive text-white font-heading font-black text-sm uppercase tracking-widest -rotate-6 shadow-lg">Cancelled</span></div>` : ""}
      </div>` : ""}
      <div class="p-5 sm:p-6 flex flex-col flex-1">
        <div class="flex flex-wrap items-center gap-2 mb-3">${badges}</div>
        <h2 class="font-heading font-bold text-lg text-foreground mb-2 line-clamp-2">${ev.icon ? ev.icon + " " : ""}${ev.title}</h2>
        ${excerpt ? `<p class="font-body text-sm text-muted-foreground leading-relaxed line-clamp-3 mb-3">${excerpt}</p>` : ""}
        ${hasMore ? `
        <div class="mt-auto pt-2">
          <button class="inline-flex items-center gap-1.5 text-sm font-heading font-semibold text-primary hover:text-primary/80 transition-colors" data-accordion-toggle="${detailsId}" data-label-show="View Details" data-label-hide="Hide Details">
            <span data-accordion-label>View Details</span>${chevron}
          </button>
        </div>
        <div id="${detailsId}" class="accordion-content">
          <div class="pt-3 border-t border-border/50 mt-3 font-body text-sm text-muted-foreground leading-relaxed space-y-2">
            ${restDescription.map((p) => `<p>${p}</p>`).join("")}
          </div>
          ${resultBlock}
          ${tags ? `<div class="flex flex-wrap gap-2 mt-4">${tags}</div>` : ""}
          ${links ? `<div class="flex flex-wrap gap-4 mt-4">${links}</div>` : ""}
          ${photos}
          ${instagramEmbed}
        </div>` : ""}
      </div>
    </article>`;
  }

  function renderEvents() {
    const list = document.getElementById("events-list");
    const empty = document.getElementById("events-empty");
    const count = document.getElementById("events-count");
    if (!list) return;

    const events = getFilteredSortedEvents();
    list.innerHTML = events.map((ev, i) => eventCardHTML(ev, i)).join("");
    list.classList.toggle("hidden", events.length === 0);
    empty.classList.toggle("hidden", events.length !== 0);
    count.textContent = `Showing ${events.length} of ${EVENTS.length} events`;

    if (typeof initScrollReveal === "function") initScrollReveal();
    if (typeof initAccordions === "function") initAccordions();
    initInstagramLazyLoad();
  }

  function processInstagramEmbeds() {
    if (window.instgrm && window.instgrm.Embeds) window.instgrm.Embeds.process();
  }

  // Hydrate each Instagram embed slot only once its accordion has actually
  // opened (and finished animating), so Instagram measures a real height.
  function initInstagramLazyLoad() {
    document.querySelectorAll(".instagram-embed-slot").forEach((slot) => {
      if (slot.dataset.bound === "1") return;
      slot.dataset.bound = "1";
      const details = slot.closest(".accordion-content");
      const toggleBtn = document.querySelector(`[data-accordion-toggle="${details.id}"]`);
      if (!toggleBtn) return;
      toggleBtn.addEventListener("click", () => {
        if (slot.dataset.loaded === "true") return;
        if (!details.classList.contains("open")) return; // this click is closing it
        slot.dataset.loaded = "true";
        setTimeout(() => {
          slot.innerHTML = `<blockquote class="instagram-media" data-instgrm-captioned data-instgrm-permalink="${slot.dataset.instagramUrl}" data-instgrm-version="14" style="margin:0; max-width:100%;"></blockquote>`;
          processInstagramEmbeds();
        }, 400); // matches .accordion-content's max-height transition duration
      });
    });
  }

  function initFilterControls() {
    document.querySelectorAll("[data-type-filter]").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.type = btn.getAttribute("data-type-filter");
        document.querySelectorAll("[data-type-filter]").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        renderEvents();
      });
    });
    document.getElementById("status-select").addEventListener("change", (e) => {
      state.status = e.target.value;
      renderEvents();
    });
    document.getElementById("sort-select").addEventListener("change", (e) => {
      state.sort = e.target.value;
      renderEvents();
    });
  }

  document.addEventListener("DOMContentLoaded", () => {
    setTimeout(() => {
      renderEvents();
      initFilterControls();
    }, 0);
  });
</script>
<script async src="https://www.instagram.com/embed.js" onload="processInstagramEmbeds()"></script>
</body>
</html>
